# Tek ConfigMap: env değişkenleri (envFrom) + sources.yaml (/config volume).
# Basit tutmak için ikisi aynı yerde; envFrom'a sources.yaml anahtarı da girer ama zararsız.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-chatbot-config
data:
  AUTH_MODE: "openshift"
  LOG_FORMAT: "json"   # OpenShift Logging / Loki için; lokalde text
  OAUTH_CLIENT_ID: "system:serviceaccount:<namespace>:mlops-chatbot"   # <namespace> değiştir
  OAUTH_REDIRECT_URL: "https://<route-host>/auth/callback"             # <route-host> değiştir
  # Şirket içi OpenAI uyumlu uç (vLLM, LiteLLM, Azure OpenAI v1). Boş bırakılırsa api.openai.com
  # LLM_BASE_URL: "http://llm-gateway.llm.svc:4000/v1"
  # EMBEDDING_BASE_URL: "http://embedding.llm.svc:8000/v1"   # boşsa LLM_BASE_URL
  LLM_MODEL: "gpt-4o-mini"
  MEMORY_LLM_MODEL: "gpt-4o-mini"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIM: "1536"
  QDRANT_COLLECTION: "mlops_docs"
  TOP_K: "6"
  ADMIN_GROUPS: "mlops-admins"
  ADMIN_SAR_VERB: "create"
  ADMIN_SAR_RESOURCE: "rolebindings"
  ADMIN_SAR_GROUP: "rbac.authorization.k8s.io"
  SOURCES_FILE: "/config/sources.yaml"
  # Sohbet DB'si (Postgres) bağlantısı şifre içerdiği için Secret'ta: DATABASE_URL
  DB_POOL_SIZE: "10"
  # native: kendi arayüzümüz, internet gerekmez. chatkit: OpenAI ChatKit (tarayıcı OpenAI CDN'ine erişmeli)
  UI_MODE: "native"
  CHATKIT_JS_URL: "https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"
  CHATKIT_DOMAIN_KEY: "local-dev"
  WORKERS: "1"
  sources.yaml: |
    # Şirket içi Azure DevOps Server: https://<sunucu>/<collection>/<project>/_git/<repo>
    # Alanların açıklaması: sources.example.yaml
    sources:
      - name: mlops-platform
        url: https://azuredevops.sirket.local/DefaultCollection/MLOps/_git/mlops-platform
        branch: main
        token_env: AZURE_DEVOPS_PAT
        exclude: ["tests/**"]
