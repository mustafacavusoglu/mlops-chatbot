# SA, OpenShift OAuth client olarak kullanılır.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-chatbot
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mlops-chatbot"}}'
---
# Bu token = OAuth client secret (Deployment'ta OAUTH_CLIENT_SECRET olarak bağlı)
apiVersion: v1
kind: Secret
metadata:
  name: mlops-chatbot-oauth-token
  annotations:
    kubernetes.io/service-account.name: mlops-chatbot
type: kubernetes.io/service-account-token
