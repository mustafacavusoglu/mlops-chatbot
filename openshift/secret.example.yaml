# GERÇEK değerleri commit etme. Oluşturmak için:
#   oc create secret generic mlops-chatbot-secrets \
#     --from-literal=QDRANT_URL=... --from-literal=LLM_API_KEY=... (vb.)
apiVersion: v1
kind: Secret
metadata:
  name: mlops-chatbot-secrets
type: Opaque
stringData:
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: ""
  LLM_API_KEY: "changeme"
  EMBEDDING_API_KEY: "changeme"
  SESSION_SECRET: "uzun-rastgele-bir-deger"
  # On-prem Azure DevOps Server PAT'i (yetki: Code -> Read). sources.yaml'daki token_env bu adı gösterir
  AZURE_DEVOPS_PAT: "changeme"
  # GITHUB_TOKEN: ""   # yalnızca özel GitHub reposu indekslenecekse
  # Sadece postgres kullanılacaksa (ConfigMap'teki sqlite değerini ezer):
  # DATABASE_URL: "postgresql+asyncpg://user:pass@host:5432/chatbot"
