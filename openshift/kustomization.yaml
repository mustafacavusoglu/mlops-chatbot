# secret.example.yaml bilerek listede yok: Secret'ı oc create secret ile oluştur.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - imagestream.yaml
  - buildconfig.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - trusted-ca.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - cronjob-indexer.yaml
# Repo listesi düz YAML olarak sources.yaml'da; ConfigMap ondan üretilir.
# Sabit isim: değişince pod yeniden başlamaz, indexer bir sonraki çalışmada yeni listeyi okur.
configMapGenerator:
  - name: mlops-chatbot-sources
    files: [sources.yaml]
    options:
      disableNameSuffixHash: true
