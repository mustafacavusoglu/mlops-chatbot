apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-chatbot
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"mlops-chatbot:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  # Sohbetler Postgres'te olduğu için pod sayısı artırılabilir (Route sticky cookie ile kullanıcı aynı poda gider)
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mlops-chatbot
  template:
    metadata:
      labels:
        app: mlops-chatbot
    spec:
      serviceAccountName: mlops-chatbot
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/<namespace>/mlops-chatbot:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mlops-chatbot-config
            - secretRef:
                name: mlops-chatbot-secrets
          env:
            # Sohbet DB'si: DATABASE_URL Secret'tan (mlops-chatbot-secrets) gelir.
            # Postgres operator'ü (Crunchy PGO vb.) kullanıcı secret'ı üretiyorsa doğrudan onun `uri`'si verilebilir:
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef: {name: <cluster>-pguser-<user>, key: uri}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-chatbot-oauth-token
                  key: token
            - name: SSL_CERT_FILE
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            # git SSL_CERT_FILE'ı okumaz; on-prem Azure DevOps Server'ın şirket CA'sı için
            - name: GIT_SSL_CAINFO
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - name: trusted-ca
              mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              subPath: ca-bundle.crt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mlops-chatbot-sources
            items:
              - {key: sources.yaml, path: sources.yaml}
        - name: trusted-ca
          configMap:
            name: mlops-chatbot-trusted-ca
            items:
              - {key: ca-bundle.crt, path: ca-bundle.crt}
