# cp sources.example.yaml sources.yaml
# OpenShift'te bu içerik configmap.yaml içindeki sources.yaml anahtarındadır.
#
# Alanlar:
#   name        aramada filtre ve atıf adı
#   url         git clone adresi (https)
#   provider    azure | github; boşsa URL'den anlaşılır ("/_git/" geçiyorsa azure)
#   branch      varsayılan main
#   token_env   PAT'i tutan ORTAM DEĞİŞKENİNİN adı (değer Secret'ta); public repoda gerekmez
#   include     sadece bu desenler indekslenir (boşsa md, adoc, ipynb, py, yaml, Dockerfile... varsayılanları)
#   exclude     include'dan sonra çıkarılacaklar
#   max_file_kb bundan büyük dosyalar atlanır (varsayılan 512)
sources:
  # Şirket içi Azure DevOps Server (on-prem) reposu
  #   adres biçimi: https://<sunucu>/<collection>/<project>/_git/<repo>
  #   eski TFS kurulumlarında:  https://<sunucu>/tfs/<collection>/<project>/_git/<repo>
  - name: mlops-platform
    url: https://azuredevops.sirket.local/DefaultCollection/MLOps/_git/mlops-platform
    branch: main
    token_env: AZURE_DEVOPS_PAT
    exclude:
      - "tests/**"
      - "**/*.lock"

  - name: workbench-images
    url: https://azuredevops.sirket.local/DefaultCollection/MLOps/_git/workbench-images
    branch: develop
    token_env: AZURE_DEVOPS_PAT
    include:
      - "**/*.md"
      - "**/Dockerfile"
      - "**/requirements*.txt"

  # Herkese açık örnek (token gerekmez): Open Data Hub = OpenShift AI'ın upstream dokümantasyonu.
  # Lokalde sistemi hemen denemek için.
  - name: odh-docs
    url: https://github.com/opendatahub-io/opendatahub-documentation.git
    include: ["modules/**/*.adoc", "*.adoc"]
