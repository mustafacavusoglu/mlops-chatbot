<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLOps Asistanı</title>
<script src="/static/vendor/marked.umd.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #0d0d0d; --muted: #6b6b6b; --surface: #f4f4f4;
    --border: #e3e3e3; --accent: #0d0d0d; --accent-fg: #ffffff; --link: #1a5fb4;
    --warn-bg: #fff6e5; --warn-fg: #8a5300; --error: #c0392b; --ok: #1e7b34;
  }
  :root[data-theme="dark"] {
    --bg: #212121; --fg: #ececec; --muted: #a3a3a3; --surface: #303030;
    --border: #3d3d3d; --accent: #ececec; --accent-fg: #0d0d0d; --link: #8ab4f8;
    --warn-bg: #3a2e14; --warn-fg: #f5c46b; --error: #ff7b6b; --ok: #6fcf8a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  body { display: flex; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  a { color: var(--link); }
  .btn { flex: none; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: none; text-decoration: none; white-space: nowrap; cursor: pointer; }
  .btn:hover { background: var(--border); }

  #sidebar { flex: none; width: 260px; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); }
  .brand { margin: 12px 14px 0; font-size: 16px; font-weight: 600; }
  #newchat { margin: 10px; text-align: left; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; border-radius: 8px; }
  .row:hover, .row[aria-current="true"] { background: var(--border); }
  .row[aria-current="true"] .conv { font-weight: 600; }
  .conv { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: none; background: none; text-align: left; cursor: pointer; }
  .conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-spin { flex: none; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  .conv-unread { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--link); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .conv-spin { animation-duration: 3s; } }
  .del { flex: none; width: 28px; height: 28px; margin-right: 4px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; opacity: .35; }
  .row:hover .del, .row[aria-current="true"] .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--error); }
  @media (hover: none) { .del { opacity: 1; } }
  .list-note { padding: 8px 10px; color: var(--muted); font-size: 13px; }
  #adminBtn { margin: 0 10px 10px; text-align: left; }
  .side-foot { display: flex; align-items: center; gap: 6px; padding: 10px; border-top: 1px solid var(--border); }
  .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 13px; font-weight: 600; line-height: 28px; text-align: center; }
  #who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { flex: none; padding: 0 6px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-size: 11px; }
  .side-foot .btn { padding: 4px 8px; }

  #main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #topbar { display: none; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #banner { margin: 12px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); font-size: 14px; }
  #host { flex: 1; min-height: 0; position: relative; }
  openai-chatkit { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #backdrop { display: none; }

  #modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.4); }
  #modal .box { width: min(640px, 100%); max-height: 90vh; overflow: auto; padding: 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); }
  #modal h2 { margin: 0 0 12px; font-size: 18px; }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .meta { color: var(--muted); font-size: 13px; margin: 8px 0; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
  td.err { color: var(--error); }
  .tabs { display: flex; gap: 6px; margin: 0 0 12px; flex-wrap: wrap; }
  .btn.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .fb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .fb-bar .gap { flex: 1; }
  .fb-card { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; overflow-wrap: anywhere; }
  .fb-head { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); }
  .fb-q { margin: 6px 0 4px; font-weight: 600; font-size: 14px; }
  .fb-a { white-space: pre-wrap; }
  .fb-a.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fb-more { margin: 2px 0 0; padding: 0; border: none; background: none; color: var(--link); cursor: pointer; font-size: 13px; }
  .fb-q2 { margin-top: 6px; color: var(--muted); }
  .fb-hit { display: block; margin-left: 10px; }
  .box-foot { display: flex; justify-content: flex-end; margin-top: 14px; }

  /* Yerel (native) sohbet paneli */
  #native { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .nhead { flex: none; padding: 10px 16px; border-bottom: 1px solid var(--border); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nscroll { flex: 1; min-height: 0; overflow-y: auto; }
  #nmsgs { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .msg { margin-bottom: 24px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { max-width: 85%; overflow-wrap: anywhere; padding: 10px 16px; border-radius: 18px; background: var(--surface); white-space: pre-wrap; }
  .msg.assistant .bubble { overflow-wrap: anywhere; }
  .bubble > :first-child { margin-top: 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 18px 0 8px; line-height: 1.3; }
  .bubble h1 { font-size: 20px; } .bubble h2 { font-size: 18px; } .bubble h3 { font-size: 16px; }
  .bubble img { max-width: 100%; }
  .bubble table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  .bubble blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .bubble code { padding: 1px 5px; border-radius: 5px; background: var(--surface); font-size: 13px; }
  .codewrap { position: relative; margin: 10px 0; }
  .codewrap pre { margin: 0; padding: 12px; padding-top: 28px; overflow-x: auto; border-radius: 10px; background: var(--surface); }
  .codewrap pre code { padding: 0; background: none; }
  .copy { position: absolute; top: 4px; right: 6px; padding: 1px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 12px; cursor: pointer; }
  .status { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--muted); font-size: 14px; }
  .status .conv-spin { display: inline-block; }
  .nerr { margin: 8px 0; color: var(--error); font-size: 14px; }
  .sources { margin-top: 14px; }
  .sources-title { margin-bottom: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .source-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 8px; }
  .source { display: block; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; color: inherit; text-decoration: none; font-size: 13px; line-height: 1.45; }
  .source:hover { background: var(--surface); }
  .source-name { font-weight: 600; overflow-wrap: anywhere; }
  .source-meta { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 4px; margin-top: 10px; }
  .fb { width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px; background: none; font-size: 16px; line-height: 1; cursor: pointer; opacity: .55; }
  .fb:hover { background: var(--surface); opacity: 1; }
  .fb.on { background: var(--accent); opacity: 1; filter: none; }
  #nempty { padding-top: 8vh; text-align: center; }
  #nempty h2 { margin: 0 0 24px; font-size: 22px; font-weight: 600; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips button { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: none; color: var(--muted); text-align: left; cursor: pointer; }
  .chips button:hover { background: var(--surface); color: var(--fg); }
  #nfoot { flex: none; padding: 0 16px 14px; }
  #nform { display: flex; align-items: flex-end; gap: 8px; max-width: 760px; margin: 0 auto; padding: 8px 8px 8px 18px; border: 1px solid transparent; border-radius: 26px; background: var(--surface); }
  #nform:focus-within { border-color: var(--muted); }
  #ninput { flex: 1; min-width: 0; max-height: 200px; padding: 6px 0; border: none; outline: none; background: none; color: inherit; font: inherit; resize: none; }
  #nsend { flex: none; width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 18px; cursor: pointer; }
  #nsend:disabled { opacity: .3; cursor: default; }
  @media (max-width: 600px) { .chips { grid-template-columns: 1fr; } }

  @media (max-width: 767px) {
    #topbar { display: flex; }
    #sidebar { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: 280px; max-width: 85vw; visibility: hidden; transform: translateX(-100%); transition: transform .2s, visibility .2s; }
    body.drawer #sidebar { visibility: visible; transform: none; }
    body.drawer #backdrop { display: block; position: fixed; z-index: 10; inset: 0; background: rgba(0,0,0,.4); }
  }
</style>
</head>
<body>
<nav id="sidebar" aria-label="Sohbetler">
  <div class="brand">MLOps Asistanı</div>
  <button class="btn" id="newchat" type="button">+ Yeni sohbet</button>
  <div id="list"></div>
  <button class="btn" id="adminBtn" type="button" hidden>⚙ Yönetim</button>
  <div class="side-foot">
    <span class="avatar" id="avatar" aria-hidden="true"></span>
    <span id="who"></span>
    <span class="badge" id="adminBadge" hidden>Admin</span>
    <button class="btn" id="theme" type="button" aria-label="Açık/koyu tema" title="Açık/koyu tema">◐</button>
    <a class="btn" href="/auth/logout">Çıkış</a>
  </div>
</nav>
<div id="backdrop"></div>

<div id="main">
  <div id="topbar">
    <button class="btn" id="menu" type="button" aria-label="Sohbetleri aç" aria-expanded="false">☰</button>
    <strong id="apptitle">MLOps Asistanı</strong>
  </div>
  <div id="banner" role="alert" hidden></div>
  <div id="host"></div>
  <section id="native" aria-label="Sohbet" hidden>
    <div class="nhead" id="ntitle">Yeni sohbet</div>
    <div id="nscroll"><div id="nmsgs" aria-live="polite"></div></div>
    <div id="nfoot">
      <form id="nform">
        <textarea id="ninput" rows="1" placeholder="Bir soru sor…" aria-label="Mesaj"></textarea>
        <button id="nsend" type="submit" aria-label="Gönder" disabled>↑</button>
      </form>
    </div>
  </section>
</div>

<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <h2 id="mtitle">Yönetim</h2>
    <div class="tabs" role="tablist">
      <button class="btn" id="tabBtnIdx" type="button" role="tab">İndeksleme</button>
      <button class="btn" id="tabBtnFb" type="button" role="tab">Geri bildirimler</button>
    </div>
    <div id="tabIdx">
    <div class="srcs" id="srcs"></div>
    <div class="meta" id="imeta"></div>
    <div class="tbl"><table>
      <thead><tr><th>Kaynak</th><th>İndekslenen</th><th>Atlanan</th><th>Silinen</th><th>Parça</th><th>Hata</th></tr></thead>
      <tbody id="itbody"></tbody>
    </table></div>
    </div>
    <div id="tabFb" hidden>
      <div class="fb-bar" id="fbFilter">
        <button class="btn" type="button" data-k="negative">👎 Olumsuz</button>
        <button class="btn" type="button" data-k="positive">👍 Olumlu</button>
        <button class="btn" type="button" data-k="all">Tümü</button>
        <span class="gap"></span>
        <a class="btn" href="/api/admin/export.jsonl" download>JSONL indir</a>
      </div>
      <div class="meta">Dosya; soru, cevap, arama sorguları ile getirilen parçalar ve skorları, ayrıca geri bildirimi içerir. Notebook'ta analiz için.</div>
      <div id="fbList"></div>
    </div>
    <div class="box-foot"><button class="btn" id="mclose" type="button">Kapat</button></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const mk = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls || "", textContent: text ?? "" });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let me = null, chat = null, native = false;
  let activeId = new URLSearchParams(location.search).get("c") || null;
  let threads = null;               // null = yüklenemedi
  const wasRunning = new Map();     // id -> running (önceki yoklama)
  const unread = new Set();         // arka planda cevabı gelen sohbetler
  const endSeen = new Set();        // bu sekmede response.end görülen aktif sohbetler
  let pollTimer = null;

  // ---- Tema ----
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $("theme").textContent = t === "dark" ? "☀" : "☾";
  }
  applyTheme(store.get("theme") === "dark" ? "dark" : "light");
  $("theme").onclick = () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    store.set("theme", t);
    applyTheme(t);
    if (chat) chat.setOptions(buildOptions());
  };

  // ---- Yardımcılar ----
  function toLogin() { location.href = "/auth/login"; }
  async function api(url, opts) {
    const r = await fetch(url, { credentials: "same-origin", ...opts });
    if (r.status === 401) { toLogin(); throw new Error("401"); }
    return r;
  }
  function showBanner(msg) { $("banner").textContent = msg; $("banner").hidden = false; }
  const NET_MSG = "Sohbet bileşeni yüklenemedi. ChatKit'in çalışması için bu cihazın cdn.platform.openai.com ve api.openai.com adreslerine erişebilmesi gerekir; ağ/güvenlik duvarı ayarlarını kontrol edip sayfayı yenile.";

  function setDrawer(open) {
    document.body.classList.toggle("drawer", open);
    $("menu").setAttribute("aria-expanded", String(open));
  }
  $("menu").onclick = () => setDrawer(true);
  $("backdrop").onclick = () => setDrawer(false);
  addEventListener("keydown", (e) => { if (e.key === "Escape") { setDrawer(false); closeModal(); } });

  function setActive(id) {
    activeId = id || null;
    history.replaceState(null, "", activeId ? `?c=${encodeURIComponent(activeId)}` : location.pathname);
    if (activeId) unread.delete(activeId);
    renderList();
  }

  // ---- ChatKit ----
  function buildOptions() {
    return {
      api: {
        url: "/chatkit",
        domainKey: me.chatkit_domain_key,
        fetch: async (u, o) => {
          const r = await fetch(u, { ...o, credentials: "same-origin" });
          if (r.status === 401) toLogin();
          return r;
        },
      },
      history: { enabled: false },
      header: { enabled: true, title: { enabled: true } },
      initialThread: activeId,
      startScreen: {
        greeting: "Merhaba! MLOps platformu, notebook'lar ve projelerinle ilgili sorularını sorabilirsin.",
        prompts: [
          { label: "gRPC desteği", prompt: "Projemde gRPC desteğini nasıl açarım?" },
          { label: "Custom package", prompt: "Notebook'ta custom package nasıl kurarım?" },
          { label: "API key güvenliği", prompt: "Notebook'a API key'i güvenli şekilde nasıl eklerim?" },
          { label: "Özel LLM erişimi", prompt: "Özel LLM modeline erişimi nasıl alırım?" },
        ],
      },
      composer: { placeholder: "Bir soru sor…" },
      theme: { colorScheme: document.documentElement.dataset.theme, radius: "round", density: "normal" },
    };
  }

  async function initChat() {
    const timer = setTimeout(() => { if (!ready) showBanner(NET_MSG); }, 15000);
    const s = document.createElement("script");
    s.src = me.chatkit_js_url;
    s.async = true;
    s.onerror = () => { clearTimeout(timer); showBanner(NET_MSG); };
    document.head.append(s);
    await customElements.whenDefined("openai-chatkit");
    mount();
  }

  // ChatKit, setThreadId'de süren stream'i kesmiyor ve eski sohbetin cevabını yeni sohbete çiziyor.
  // Cevap akarken sohbet değişirse bileşeni baştan kuruyoruz: bağlantı kopar, sunucu cevabı arkada bitirir.
  let ready = false, streaming = false;
  function mount() {
    streaming = false;
    chat?.remove();
    chat = document.createElement("openai-chatkit");
    chat.addEventListener("chatkit.ready", () => { ready = true; $("banner").hidden = true; });
    chat.addEventListener("chatkit.error", (e) => {
      console.error("chatkit.error", e.detail);
      showBanner("Sohbet sırasında bir hata oluştu. " + NET_MSG);
    });
    chat.addEventListener("chatkit.thread.change", (e) => {
      const id = e.detail?.threadId ?? null;
      if (id !== activeId) setActive(id);
      loadList();
    });
    chat.addEventListener("chatkit.response.start", () => { streaming = true; if (activeId) endSeen.delete(activeId); loadList(); });
    chat.addEventListener("chatkit.response.end", () => { streaming = false; if (activeId) endSeen.add(activeId); loadList(); });
    chat.setOptions(buildOptions());
    $("host").append(chat);
  }

  async function ckSwitch(id) {
    setDrawer(false);
    setActive(id);
    if (streaming) return mount();  // initialThread = activeId
    try { await chat?.setThreadId(id); } catch (e) { console.error(e); }
  }

  // Mod dağıtımı: kenar çubuğu iki modda da aynı, sohbet paneli moda göre
  const switchTo = (id) => (native ? nOpen(id) : ckSwitch(id));

  // ---- Kenar çubuğu ----
  function renderList() {
    if (native) nSync();
    const list = $("list");
    list.replaceChildren();
    if (threads === null) return list.append(mk("div", "list-note", "Sohbetler yüklenemedi"));
    if (!threads.length) return list.append(mk("div", "list-note", "Henüz sohbet yok"));
    for (const t of threads) {
      const row = list.appendChild(mk("div", "row"));
      if (t.id === activeId) row.setAttribute("aria-current", "true");
      const b = row.appendChild(mk("button", "conv"));
      b.type = "button";
      const title = t.title || "Yeni sohbet";
      b.title = title;
      b.append(mk("span", "conv-title", title));
      if (t.running) b.append(Object.assign(mk("span", "conv-spin"), { role: "img", ariaLabel: "Cevap hazırlanıyor" }));
      else if (unread.has(t.id)) b.append(Object.assign(mk("span", "conv-unread"), { role: "img", ariaLabel: "Yeni cevap" }));
      b.onclick = () => openThread(t.id);
      const d = row.appendChild(mk("button", "del", "×"));
      d.type = "button";
      d.title = d.ariaLabel = "Sohbeti sil";
      d.onclick = () => removeThread(t);
    }
  }

  const openThread = (id) => switchTo(id);
  async function newChat() {
    await switchTo(null);
    if (native) $("ninput").focus();
    else chat?.focusComposer().catch(() => {});
  }
  $("newchat").onclick = newChat;

  async function removeThread(t) {
    if (!confirm(`"${t.title || "Yeni sohbet"}" sohbeti silinsin mi?`)) return;
    try {
      const r = await api(`/api/threads/${encodeURIComponent(t.id)}`, { method: "DELETE" });
      if (!r.ok) throw new Error(r.status);
    } catch (e) { if (e.message !== "401") alert("Sohbet silinemedi."); return; }
    if (native) nDrop(t.id);
    if (t.id === activeId) await newChat();
    loadList();
  }

  // ---- Liste + yoklama ----
  async function loadList() {
    try {
      const r = await api("/api/threads");
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      threads = data;
      for (const t of data) {
        const was = wasRunning.get(t.id);
        if (was && !t.running) {
          if (t.id === activeId) onActiveFinished(t.id);
          else unread.add(t.id);
        }
        wasRunning.set(t.id, t.running);
      }
    } catch (e) { if (e.message === "401") return; threads = null; }
    renderList();
    schedule();
  }
  function schedule() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(loadList, threads?.some((t) => t.running) ? 3000 : 30000);
  }
  // Aktif sohbet bittiğinde response.end bu sekmede görülmediyse (başka sohbete geçip dönüldü) cevabı yeniden yükle
  function onActiveFinished(id) {
    if (native) return nReload(id);
    setTimeout(async () => {
      if (id !== activeId) return;
      if (endSeen.delete(id)) return;
      try { await chat?.fetchUpdates?.(); } catch (e) { console.error(e); }
      // ponytail: fetchUpdates yenilediyse de tekrar yükler; zararsız, görünür yenilenme doğrulanamıyor
      setTimeout(() => { if (id === activeId) chat?.setThreadId(id).catch(console.error); }, 1500);
    }, 1500);
  }

  // ---- Yerel sohbet paneli (ChatKit protokolü, CDN yok) ----
  const live = new Map();   // sohbet id (veya geçici anahtar) -> {text, parts, progress, sources, error, done, userText, ctrl}
  let fbMap = {};   // aktif sohbetin oyları: item id -> positive|negative
  let loaded = [], loadErr = false, viewTmp = null, tmpSeq = 0;
  const ERR_MSG = "Cevap alınamadı, tekrar dener misin?";
  const PROMPTS = [
    ["gRPC desteği", "Projemde gRPC desteğini nasıl açarım?"],
    ["Custom package", "Notebook'ta custom package nasıl kurarım?"],
    ["API key güvenliği", "Notebook'a API key'i güvenli şekilde nasıl eklerim?"],
    ["Özel LLM erişimi", "Özel LLM modeline erişimi nasıl alırım?"],
  ];
  const activeKey = () => activeId || viewTmp;
  const inflight = (k) => { const s = k && live.get(k); return !!s && !s.done; };
  const lastItem = () => loaded[loaded.length - 1];
  // sunucuda çalışan ama bu sekmede stream'i olmayan cevap (ör. sayfa yenilendi)
  const bgRunning = () => !!activeId && !live.has(activeId) && !!threads?.find((t) => t.id === activeId)?.running && lastItem()?.type !== "assistant_message";
  const busy = () => inflight(activeKey()) || bgRunning();

  // SSE ayrıştırıcı: tamponu ve yeni parçayı alır, tam olayları ve kalan tamponu döndürür
  function sseParse(buf, chunk) {
    const parts = (buf + chunk).replace(/\r\n/g, "\n").split("\n\n");
    const rest = parts.pop();
    const events = [];
    for (const p of parts) {
      const d = p.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).replace(/^ /, "")).join("\n");
      if (!d) continue;
      try { events.push(JSON.parse(d)); } catch {}
    }
    return [events, rest];
  }

  const rpc = async (body, signal) => {
    const r = await fetch("/chatkit", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
    if (r.status === 401) { toLogin(); throw new Error("401"); }
    return r;
  };
  const mkInput = (t) => ({ content: [{ type: "input_text", text: t }], attachments: [], inference_options: {} });
  const itemText = (it) => (it.content || []).map((c) => c.text || "").join("");
  const itemSources = (it) => {
    const seen = new Set(), out = [];
    for (const c of it.content || []) for (const a of c.annotations || []) {
      const u = a?.source?.url;
      if (!u || seen.has(u) || !/^https?:\/\//i.test(u)) continue;
      seen.add(u);
      out.push({ title: a.source.title || u, url: u });
    }
    return out;
  };

  function renderMd(el, text) {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
    for (const a of el.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    for (const pre of el.querySelectorAll("pre")) {
      const w = document.createElement("div");
      w.className = "codewrap";
      pre.replaceWith(w);
      const b = mk("button", "copy", "Kopyala");
      b.type = "button";
      b.ariaLabel = "Kodu kopyala";
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(pre.innerText); b.textContent = "Kopyalandı"; } catch { b.textContent = "Kopyalanamadı"; }
        setTimeout(() => (b.textContent = "Kopyala"), 1500);
      };
      w.append(pre, b);
    }
  }

  function aNode(text, sources, itemId) {
    const m = mk("div", "msg assistant");
    const b = m.appendChild(mk("div", "bubble"));
    renderMd(b, text);
    if (sources?.length) {
      const box = m.appendChild(mk("div", "sources"));
      box.append(mk("div", "sources-title", "Kaynaklar"));
      const l = box.appendChild(mk("div", "source-list"));
      for (const s of sources) {
        const a = l.appendChild(mk("a", "source"));
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.append(mk("div", "source-name", s.title), mk("div", "source-meta", s.url));
      }
    }
    if (itemId) m.append(fbRow(itemId));
    return m;
  }
  // Kayıtlı cevap altında 👍/👎; oy yoksa geri alma yok (protokol)
  function fbRow(id) {
    const row = mk("div", "actions"), btns = {}, map = fbMap, tid = activeId;
    const paint = () => { for (const k in btns) { btns[k].classList.toggle("on", map[id] === k); btns[k].ariaPressed = String(map[id] === k); } };
    for (const [kind, ic, label] of [["positive", "👍", "Faydalı"], ["negative", "👎", "Faydalı değil"]]) {
      const b = btns[kind] = row.appendChild(mk("button", "fb", ic));
      b.type = "button"; b.title = b.ariaLabel = label;
      b.onclick = async () => {
        const prev = map[id];
        if (prev === kind) return;
        map[id] = kind; paint();
        try {
          const r = await rpc({ type: "items.feedback", params: { thread_id: tid, item_ids: [id], kind } });
          if (!r.ok) throw new Error(r.status);
        } catch (e) {
          if (map[id] === kind) { if (prev) map[id] = prev; else delete map[id]; paint(); }
        }
      };
    }
    paint();
    return row;
  }
  function uNode(text) {
    const m = mk("div", "msg user");
    m.append(mk("div", "bubble", text));
    return m;
  }
  const statusNode = (txt) => {
    const d = mk("div", "status");
    d.append(Object.assign(mk("span", "conv-spin"), { ariaHidden: "true" }), mk("span", "", txt));
    return d;
  };

  const nearBottom = () => { const e = $("nscroll"); return e.scrollHeight - e.scrollTop - e.clientHeight < 80; };

  function renderAll(first) {
    const sc = $("nscroll"), top = sc.scrollTop, stick = first || nearBottom();
    const box = $("nmsgs");
    box.replaceChildren();
    if (!activeId && !live.has(activeKey())) {
      const e = box.appendChild(mk("div", ""));
      e.id = "nempty";
      e.append(mk("h2", "", "Merhaba! MLOps platformu, notebook'lar ve projelerinle ilgili sorularını sorabilirsin."));
      const c = e.appendChild(mk("div", "chips"));
      for (const [label, prompt] of PROMPTS) {
        const b = c.appendChild(mk("button", "", label));
        b.type = "button";
        b.onclick = () => nSend(prompt);
      }
    } else {
      for (const it of loaded) {
        if (it.type === "user_message") box.append(uNode(itemText(it)));
        else if (it.type === "assistant_message") box.append(aNode(itemText(it), itemSources(it), it.id));
      }
      if (loadErr) box.append(mk("div", "nerr", "Sohbet yüklenemedi."));
      box.append(Object.assign(mk("div", ""), { id: "ntail" }));
      renderTail();
    }
    sc.scrollTop = stick ? sc.scrollHeight : top;
    updateSend();
  }

  // Akan cevap yalnızca kuyruk alanında çizilir; üstteki mesajlara dokunulmaz
  function renderTail() {
    const tail = $("ntail");
    if (!tail) return;
    const stick = nearBottom();
    tail.replaceChildren();
    const s = live.get(activeKey());
    const last = lastItem();
    if (s) {
      if (!(last?.type === "user_message" && itemText(last) === s.userText) && !(last?.type === "assistant_message" && s.done)) tail.append(uNode(s.userText));
      if (s.text && !(s.done && last?.type === "assistant_message")) tail.append(aNode(s.text, s.sources));
      if (!s.done && !s.text) tail.append(statusNode(s.progress || "Cevap hazırlanıyor…"));
      else if (!s.done && s.progress) tail.append(statusNode(s.progress));
      if (s.error) tail.append(mk("div", "nerr", s.error));
    } else if (bgRunning()) {
      tail.append(statusNode("Cevap hazırlanıyor…"));
    }
    if (stick) $("nscroll").scrollTop = $("nscroll").scrollHeight;
    updateSend();
  }
  let raf = 0;
  function schedTail(k) {
    if (k !== activeKey() || raf) return;
    raf = requestAnimationFrame(() => { raf = 0; renderTail(); });
  }

  function nSync() {
    const t = activeId && threads?.find((x) => x.id === activeId)?.title;
    $("ntitle").textContent = t || "Yeni sohbet";
    renderTail();
  }
  function updateSend() { $("nsend").disabled = !$("ninput").value.trim() || busy(); }

  async function loadItems(id) {
    const items = [];
    let after = null, fb = {};
    // oylar items.list ile paralel; hata olursa oysuz devam
    const fbP = api(`/api/threads/${encodeURIComponent(id)}/feedback`).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
    try {
      for (let i = 0; i < 10; i++) {
        const r = await rpc({ type: "items.list", params: { thread_id: id, limit: 200, order: "asc", ...(after ? { after } : {}) } });
        if (r.status === 404) {
          if (id === activeId) { nDrop(id); setActive(null); loaded = []; renderAll(true); loadList(); }
          return;
        }
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        items.push(...(j.data || []));
        if (!j.has_more || !j.after) break;
        after = j.after;
      }
    } catch (e) {
      if (e.message === "401" || id !== activeId) return;
      loadErr = true; renderAll(true);
      return;
    }
    fb = await fbP;
    if (id !== activeId) return;
    fbMap = fb && typeof fb === "object" ? fb : {};
    loaded = items; loadErr = false;
    renderAll(false);
  }

  async function nOpen(id) {
    setDrawer(false);
    setActive(id);
    viewTmp = null;
    loaded = []; loadErr = false; fbMap = {};
    renderAll(true);
    if (id) {
      await loadItems(id);
      $("nscroll").scrollTop = $("nscroll").scrollHeight;
    }
  }
  // Aktif sohbet sunucuda bitti: kayıtlı hali yeniden yükle (bu sekmede akış sürüyorsa akış bitince yüklenir)
  function nReload(id) {
    if (id === activeId && !inflight(id)) loadItems(id);
  }
  function nDrop(id) {
    live.get(id)?.ctrl.abort();
    live.delete(id);
    if (id === activeId) { loaded = []; }
  }

  function onEvent(ev, s, rekey) {
    switch (ev.type) {
      case "thread.created": rekey(ev.thread.id); break;
      case "thread.item.done": {
        const it = ev.item || {};
        if (it.type === "user_message") s.userText = itemText(it) || s.userText;
        else if (it.type === "assistant_message") {
          s.text = itemText(it); s.parts = [s.text]; s.sources = itemSources(it); s.progress = "";
        }
        break;
      }
      case "thread.item.added":
        if (ev.item?.type === "assistant_message") { s.parts = []; s.text = ""; }
        break;
      case "thread.item.updated": {
        const u = ev.update || {}, i = u.content_index || 0;
        if (u.type === "assistant_message.content_part.added") s.parts[i] = u.content?.text || "";
        else if (u.type === "assistant_message.content_part.text_delta") { s.parts[i] = (s.parts[i] || "") + (u.delta || ""); s.progress = ""; }
        else if (u.type === "assistant_message.content_part.done") s.parts[i] = u.content?.text ?? s.parts[i] ?? "";
        else break;
        s.text = s.parts.join("");
        break;
      }
      case "progress_update": s.progress = ev.text || ""; break;
      case "thread.updated": loadList(); break;
      case "error": console.error("chatkit error", ev); s.error = ERR_MSG; break;
    }
  }

  async function nSend(text) {
    text = text.trim();
    if (!text || busy()) return;
    const tmp = activeId ? null : (viewTmp = `tmp${++tmpSeq}`);
    let k = activeId || tmp;
    const s = { text: "", parts: [], progress: "", sources: [], error: "", done: false, userText: text, ctrl: new AbortController() };
    live.set(k, s);
    const input = $("ninput");
    input.value = ""; input.style.height = "auto";
    if (!activeId) renderAll(true); else { renderTail(); $("nscroll").scrollTop = $("nscroll").scrollHeight; }
    const body = activeId
      ? { type: "threads.add_user_message", params: { thread_id: activeId, input: mkInput(text) } }
      : { type: "threads.create", params: { input: mkInput(text) } };
    const rekey = (id) => {
      live.delete(k); k = id; live.set(k, s);
      if (tmp && viewTmp === tmp) { viewTmp = null; setActive(id); }
      loadList();
    };
    try {
      const r = await rpc(body, s.ctrl.signal);
      if (!r.ok || !r.body) throw new Error(r.status);
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        let evs;
        [evs, buf] = sseParse(buf, dec.decode(value, { stream: true }));
        for (const ev of evs) onEvent(ev, s, rekey);
        schedTail(k);
      }
    } catch (e) {
      if (s.ctrl.signal.aborted || e.message === "401") return;
      console.error(e);
      s.error = ERR_MSG;
    }
    if (live.get(k) !== s) return; // silindi
    s.done = true;
    const wasActive = k === activeKey();
    if (wasActive && !s.error) { await loadItems(k); }
    if (live.get(k) === s && !s.error) live.delete(k);
    if (!wasActive && !s.error && live.get(k) !== s) unread.add(k);
    if (k === activeKey()) renderTail();
    loadList();
  }

  const ninput = $("ninput");
  ninput.oninput = () => {
    ninput.style.height = "auto";
    ninput.style.height = `${ninput.scrollHeight}px`;
    updateSend();
  };
  ninput.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("nform").requestSubmit(); }
  };
  $("nform").onsubmit = (e) => { e.preventDefault(); nSend(ninput.value); };

  async function initNative() {
    native = true;
    $("host").hidden = true;
    $("native").hidden = false;
    await nOpen(activeId);
  }

  // ---- Admin paneli ----
  let admTimer = null;
  const fmt = (v) => (v ? new Date(v).toLocaleString("tr") : "-");
  let fbKind = "negative", fbSeq = 0;
  function showTab(t) {
    const idx = t === "idx";
    $("tabIdx").hidden = !idx; $("tabFb").hidden = idx;
    $("tabBtnIdx").classList.toggle("on", idx); $("tabBtnFb").classList.toggle("on", !idx);
    for (const b of $("fbFilter").querySelectorAll("button")) b.classList.toggle("on", b.dataset.k === fbKind);
    clearTimeout(admTimer);
    if (idx) pollStatus(); else loadFb();
  }
  $("tabBtnIdx").onclick = () => showTab("idx");
  $("tabBtnFb").onclick = () => showTab("fb");
  for (const b of $("fbFilter").querySelectorAll("button")) b.onclick = () => { fbKind = b.dataset.k; showTab("fb"); };

  function fbCard(x) {
    const c = mk("div", "fb-card");
    const h = c.appendChild(mk("div", "fb-head"));
    h.append(mk("span", "", x.kind === "positive" ? "👍" : "👎"), mk("span", "", fmt(x.created_at)), mk("span", "", x.user_id || "-"));
    c.append(mk("div", "fb-q", x.question || "(soru kaydı yok)"));
    const ans = x.answer || "";
    const a = c.appendChild(mk("div", "fb-a", ans || "(cevap kaydı yok)"));
    if (ans.length > 200 || ans.split("\n").length > 3) {
      a.classList.add("clamp");
      const m = c.appendChild(mk("button", "fb-more", "Devamı"));
      m.type = "button";
      m.onclick = () => { m.textContent = a.classList.toggle("clamp") ? "Devamı" : "Daralt"; };
    }
    const cited = new Set(x.cited || []);
    for (const q of x.searches || []) {
      c.append(mk("div", "fb-q2", `Arama: ${q.query}${q.repo ? ` (${q.repo})` : ""}`));
      for (const hit of q.hits || []) {
        const row = c.appendChild(mk("span", "fb-hit"));
        const name = `${hit.repo}/${hit.path}`;
        if (/^https?:\/\//i.test(hit.url || "")) {
          const l = row.appendChild(mk("a", "", name));
          l.href = hit.url; l.target = "_blank"; l.rel = "noopener noreferrer";
        } else row.append(mk("span", "", name));
        row.append(mk("span", "meta", ` ${Number(hit.score).toFixed(2)}${cited.has(hit.url) ? " ✓ atıf" : ""}`));
      }
    }
    const meta = [x.model, x.latency_ms != null && `${(x.latency_ms / 1000).toFixed(1)} sn`].filter(Boolean).join(" · ");
    if (meta) c.append(mk("div", "meta", meta));
    return c;
  }
  async function loadFb() {
    const n = ++fbSeq, list = $("fbList");
    list.replaceChildren(mk("div", "meta", "Yükleniyor…"));
    let rows;
    try {
      const r = await api(`/api/admin/feedback?kind=${fbKind}&limit=50`);
      if (!r.ok) throw new Error(r.status);
      rows = await r.json();
    } catch (e) {
      if (n === fbSeq && e.message !== "401") list.replaceChildren(mk("div", "meta", "Geri bildirimler alınamadı."));
      return;
    }
    if (n !== fbSeq) return;
    list.replaceChildren();
    if (!rows.length) list.append(mk("div", "meta", "Henüz geri bildirim yok"));
    for (const x of rows) list.append(fbCard(x));
  }

  function closeModal() { $("modal").hidden = true; clearTimeout(admTimer); }
  $("mclose").onclick = closeModal;
  $("modal").onclick = (e) => { if (e.target === $("modal")) closeModal(); };

  async function reindex(source) {
    try {
      const r = await api("/api/admin/reindex" + (source ? `?source=${encodeURIComponent(source)}` : ""), { method: "POST" });
      if (r.status === 202) { const j = await r.json(); if (!j.started) alert("İndeksleme zaten çalışıyor."); }
      else alert("İndeksleme başlatılamadı.");
    } catch (e) { if (e.message !== "401") alert("İndeksleme başlatılamadı."); }
    pollStatus();
  }
  async function pollStatus() {
    clearTimeout(admTimer);
    if ($("modal").hidden || $("tabIdx").hidden) return;
    let running = false;
    try {
      const r = await api("/api/admin/index-status");
      const s = await r.json();
      running = !!s.running;
      $("imeta").textContent = `${running ? "Çalışıyor…" : "Beklemede"} · Başlangıç: ${fmt(s.started_at)} · Bitiş: ${fmt(s.finished_at)} · Tetikleyen: ${s.trigger === "schedule" ? "zamanlanmış" : s.trigger === "manual" ? "manuel" : s.trigger || "-"}`;
      const body = $("itbody");
      body.replaceChildren();
      for (const [name, x] of Object.entries(s.results || {})) {
        const tr = body.appendChild(mk("tr"));
        for (const v of [name, x.files_indexed, x.files_skipped, x.files_deleted, x.chunks]) tr.append(mk("td", "", v ?? "-"));
        tr.append(mk("td", x.error ? "err" : "", x.error || ""));
      }
      if (!body.children.length) body.append(Object.assign(mk("td", "", "Henüz sonuç yok"), { colSpan: 6 }));
    } catch (e) { if (e.message !== "401") $("imeta").textContent = "Durum alınamadı."; }
    if (!$("tabIdx").hidden) admTimer = setTimeout(pollStatus, running ? 2000 : 10000);
  }
  async function openAdmin() {
    $("modal").hidden = false;
    showTab("idx");
    const box = $("srcs");
    box.replaceChildren();
    const all = box.appendChild(mk("button", "btn", "Tümünü indeksle"));
    all.type = "button";
    all.onclick = () => reindex();
    try {
      const r = await api("/api/admin/sources");
      for (const s of await r.json()) {
        const b = box.appendChild(mk("button", "btn", s.name));
        b.type = "button";
        b.title = [s.provider, s.url, s.branch].filter(Boolean).join(" · ");
        b.onclick = () => reindex(s.name);
      }
    } catch (e) { if (e.message !== "401") box.append(mk("span", "meta", "Kaynaklar alınamadı.")); }
  }

  // ---- Başlangıç ----
  (async () => {
    try {
      const r = await fetch("/api/me", { credentials: "same-origin" });
      if (r.status === 401) return toLogin();
      if (!r.ok) throw new Error(r.status);
      me = await r.json();
    } catch { return showBanner("Sunucuya ulaşılamadı. Sayfayı yenilemeyi dene."); }
    document.title = me.title || document.title;
    $("apptitle").textContent = document.querySelector(".brand").textContent = me.title || "MLOps Asistanı";
    $("who").textContent = me.user;
    $("avatar").textContent = Array.from(me.user || "?")[0].toLocaleUpperCase("tr");
    if (me.is_admin) { $("adminBadge").hidden = false; $("adminBtn").hidden = false; $("adminBtn").onclick = openAdmin; }
    loadList();
    (me.ui_mode === "chatkit" ? initChat() : initNative()).catch((e) => { console.error(e); showBanner(NET_MSG); });
  })();
})();
</script>
</body>
